<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#291561"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Trilha dos 10 Mundos</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#92e1ff,#edffef);color:#17304b;min-height:100vh;overflow-x:hidden}main{max-width:680px;margin:auto;padding:10px}.hidden{display:none!important}.card{background:#fff;border-radius:22px;padding:14px;margin:9px 0;box-shadow:0 7px 22px #0002}h1{color:#291561;margin:2px 0;font-size:clamp(28px,9vw,48px)}button,input,select{font:inherit;padding:11px;border:2px solid #d7cff4;border-radius:13px}button{background:#ffd84a;color:#291561;font-weight:900}.top{display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}.audio{display:flex;gap:4px}.audio button{padding:8px}.setupgrid{display:grid;gap:9px}.editor{background:#f2efff;border-radius:15px;padding:9px;margin:6px 0}.editor input{width:100%;margin:3px 0}.members{display:grid;grid-template-columns:1fr 1fr;gap:4px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}.quick div{background:#f4f1ff;border-radius:12px;padding:7px;font-size:10px}.quick b{display:block;font-size:24px}.scores{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.score{min-width:145px;background:#fff;border:4px solid transparent;padding:8px;border-radius:14px}.score.active{border-color:#ffd84a;animation:glow 1s infinite alternate}.score span,.score small{display:block}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px;border-radius:25px;background:linear-gradient(135deg,#fff1a9,#fff,#cdeaff);transition:.3s}.cell{aspect-ratio:1;position:relative;border:2px solid #fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 2px 6px #0002}.cell small{position:absolute;top:2px;left:4px;font-size:9px}.w0,.w1{background:#8ce49e}.w2,.w3{background:#c7b1ff}.w4,.w5{background:#a4dbff}.w6,.w7{background:#ffd08a}.w8,.w9{background:#ffa8ce}.pawn,.ghost{position:absolute;font-style:normal;font-size:22px;filter:drop-shadow(0 2px 2px #0005);animation:bob .7s infinite alternate}.p0{top:-14px;left:2%}.p1{top:-14px;right:2%}.p2{bottom:-13px;left:2%}.p3{bottom:-13px;right:2%}.p4{top:24%;left:34%}.ghost{opacity:.5;right:0;bottom:0}.panel{text-align:center}.die{font-size:70px}.primary{width:100%;padding:15px}.question{font-size:38px;font-weight:900;color:#291561;margin:8px}.answer{width:100%;font-size:29px;text-align:center}.timer{height:12px;background:#ddd;border-radius:99px;overflow:hidden}.bar{height:100%;background:#ffd84a;transition:width 1s linear}.danger{background:#ff586c}.tag{display:inline-block;background:#eee9ff;padding:5px 8px;border-radius:999px;margin:2px;font-size:12px}.feedback{font-weight:900}.good{color:#16834c}.learn{color:#a85100}.medalbox{max-height:280px;overflow:auto}.medalbox span{display:inline-block;background:#f2efff;border-radius:8px;padding:5px;margin:2px;font-size:11px}.modal{display:none;position:fixed;inset:0;z-index:40;background:#160943dc;padding:12px;overflow:auto}.modal.show{display:flex;align-items:center}.modal .card{max-width:620px;margin:auto}.dots{display:flex;gap:4px}.dot{height:7px;flex:1;background:#ddd;border-radius:99px}.dot.on{background:#6d45d8}.practice{display:flex;gap:6px}.practice button{flex:1}.confetti{position:fixed;top:-35px;z-index:99;font-style:normal;animation:fall 2s forwards}.rolling{animation:roll .18s infinite}.shake{animation:shake .45s}.pulse{animation:pulse .7s}@keyframes bob{to{transform:translateY(-4px)}}@keyframes glow{to{box-shadow:0 0 18px #ffd84a}}@keyframes roll{to{transform:rotate(25deg) scale(1.08)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes pulse{50%{transform:scale(1.02);filter:brightness(1.1)}}
</style></head><body><main><header class="top"><div><h1>Trilha dos 10 Mundos</h1><b>Tabuada + Adição</b></div><div class="audio"><button onclick="openTour()">❓</button><button id="musicBtn" onclick="toggleMusic()">🎵</button><button id="fxBtn" onclick="toggleFx()">🔊</button><button id="install" class="hidden">📲</button></div></header>
<section id="setup" class="card"><h2>Prepare a partida</h2><div class="quick"><div><b>1️⃣</b>Escolha</div><div><b>🎲</b>Jogue</div><div><b>✏️</b>Resolva</div><div><b>🏅</b>Evolua</div></div><label>Formato<select id="format" onchange="buildEditors()"><option value="individual">Individual, cada pessoa por si</option><option value="coop">Cooperativo, uma equipe</option><option value="teams" selected>Competição entre equipes</option></select></label><label id="countLabel">Quantidade<select id="count" onchange="buildEditors()"><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div id="editors"></div><label>Desafios<select id="mode"><option value="multi">Tabuada</option><option value="add">Adição</option><option value="mixed" selected>Misto</option></select></label><label>Tempo<select id="timeMode"><option value="off">Sem tempo</option><option value="on">Com tempo</option><option value="adaptive" selected>Adaptativo</option></select></label><button class="primary" onclick="startGame()">COMEÇAR A AVENTURA</button><div class="top"><button onclick="backup()">⬇️ Backup</button><label class="tag">⬆️ Restaurar<input hidden type="file" onchange="restore(this.files[0])"></label></div></section>
<section id="game" class="hidden"><div id="scores" class="scores"></div><div class="card"><div class="top"><b id="worldText"></b><button onclick="newGame()">Nova partida</button></div><div id="board" class="board"></div></div><div class="card panel"><h2 id="turnText"></h2><div id="memberText"></div><div id="die" class="die">⚄</div><button id="rollBtn" class="primary" onclick="roll()">JOGAR O DADO</button><div id="challenge" class="hidden"><div id="bonus"></div><div id="question" class="question"></div><div id="timerWrap" class="hidden"><b id="clock"></b><div class="timer"><div id="bar" class="bar"></div></div></div><input id="answer" class="answer" inputmode="numeric"><button class="primary" onclick="check()">RESPONDER</button></div><p id="tip"></p><p id="feedback" class="feedback"></p></div><div class="card medalbox"><h3>🏅 Medalhas e recompensas</h3><div id="medals"></div></div><div class="card"><h3>🏆 Placar por modo</h3><div id="leader"></div></div></section></main>
<div id="tour" class="modal"><div class="card"><div class="top"><b>Tutorial dinâmico</b><button onclick="closeTour()">✕</button></div><div id="dots" class="dots"></div><div id="tourBody"></div><div class="top"><button onclick="prevTour()">← Voltar</button><button onclick="nextTour()">Continuar →</button></div></div></div><script>
const AV=['🧙','🦸','🧚','🥷','🧝'],WORLD=['Jardim das Somas','Ponte do Dez','Floresta dos Dobros','Caverna dos Produtos','Castelo dos Números','Lago das Mãos','Montanha dos Desafios','Selva dos Padrões','Planeta da Matemática','Portal Final'],PH=['Boa tentativa!','Vamos pensar juntos.'];let sides=[],turn=0,q=null,round=0,timerId,timeLeft=0,ctx,musicTimer,musicOn=true,fxOn=true,deferred,tourN=0;const T=[['👋','Bem-vinda','Escolha como jogar e quem participará.'],['👤🤝🏆','Três formatos','Individual, uma equipe cooperativa ou competição entre equipes.'],['🎲','Jogue o dado','Uma resposta correta confirma todo o movimento.'],['➕✖️','Aprenda','Escolha Adição, Tabuada ou Misto.'],['⏱️','Controle o tempo','Sem tempo, com tempo ou adaptativo.'],['🗺️🛡️🐉','Evolua','Ganhe mapas, escudos, dragões e medalhas.'],['⚡','Bônus relâmpago','A cada cinco perguntas, há um desafio de 10 segundos.'],['4 × 3 = ?','Pratique','Escolha: 7, 12 ou 16.']];
function buildEditors(){let f=format.value,n=f==='coop'?1:+count.value;countLabel.classList.toggle('hidden',f==='coop');editors.innerHTML='';for(let i=0;i<n;i++){let title=f==='individual'?`Jogador ${i+1}`:f==='coop'?'Equipe da Família':`Equipe ${String.fromCharCode(65+i)}`;editors.innerHTML+=`<div class="editor"><input class="sideName" value="${title}"><div class="members">${Array.from({length:f==='individual'?1:5},(_,j)=>`<input class="member" maxlength="18" placeholder="Integrante ${j+1}" value="${i===0&&j===0?'Isadora':''}">`).join('')}</div></div>`}}
function saved(){try{return JSON.parse(localStorage.getItem('trilhaMobileComplete')||'{}')}catch(e){return{}}}function saveState(){let d=saved();d.profiles=d.profiles||{};sides.forEach(s=>{let k=format.value+'|'+s.name,old=d.profiles[k]||{};d.profiles[k]={points:Math.max(old.points||0,s.points),best:Math.max(old.best||0,s.pos),multi:s.multi,add:s.add,members:s.members}});localStorage.setItem('trilhaMobileComplete',JSON.stringify(d))}function makeSide(el,i){let name=el.querySelector('.sideName').value.trim()||`Equipe ${i+1}`,key=format.value+'|'+name,old=(saved().profiles||{})[key]||{};return{name,members:[...el.querySelectorAll('.member')].map(x=>x.value.trim()).filter(Boolean),avatar:AV[i],points:old.points||0,pos:0,multi:old.multi||Array(10).fill(0),add:old.add||Array(3).fill(0),pending:0,best:old.best||0}}
function startGame(){sides=[...document.querySelectorAll('.editor')].map(makeSide);setup.classList.add('hidden');game.classList.remove('hidden');audio();startMusic();render();prepare()}function audio(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function note(f,d=.1,v=.05,type='sine'){if(!fxOn)return;audio();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d)}function sound(k){let a=k==='ok'?[523,659,784]:k==='bad'?[250,200,160]:k==='win'?[523,659,784,1047]:[180,230,290];a.forEach((f,i)=>setTimeout(()=>note(f,.16,.06,k==='bad'?'triangle':'sine'),i*90))}function startMusic(){if(!musicOn||musicTimer)return;let a=[262,330,392,330,294,349,440,349],i=0;musicTimer=setInterval(()=>{let old=fxOn;fxOn=true;note(a[i++%a.length],.28,.015,'triangle');fxOn=old},560)}function toggleMusic(){musicOn=!musicOn;musicBtn.textContent=musicOn?'🎵':'🔇';if(musicOn)startMusic();else{clearInterval(musicTimer);musicTimer=null}}function toggleFx(){fxOn=!fxOn;fxBtn.textContent=fxOn?'🔊':'🔈'}
function makeQ(){let s=sides[turn],kind=mode.value==='mixed'?(Math.random()<.5?'add':'multi'):mode.value;if(kind==='multi'){let a=1+Math.floor(Math.random()*10),b=1+Math.floor(Math.random()*10);return{kind,idx:a-1,text:`${a} × ${b} = ?`,ans:a*b,tip:`Pense em ${a} grupos de ${b}.`}}let st=s.add[0]<8?0:s.add[1]<8?1:2,max=[10,20,100][st],a=Math.floor(Math.random()*(max+1)),b=Math.floor(Math.random()*(max-a+1));return{kind,idx:st,text:`${a} + ${b} = ?`,ans:a+b,tip:'Junte as duas quantidades.'}}
function prepare(){let s=sides[turn];turnText.textContent=`Vez de ${s.name}`;memberText.innerHTML=s.members.map(x=>`<span class="tag">${x}</span>`).join('');worldText.textContent=WORLD[Math.min(9,Math.floor(Math.max(0,s.pos-1)/3))];rollBtn.disabled=false;challenge.classList.add('hidden')}
function roll(){rollBtn.disabled=true;sound('roll');die.classList.add('rolling');let n=0,iv=setInterval(()=>{let d=1+Math.floor(Math.random()*6);die.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];if(++n===9){clearInterval(iv);die.classList.remove('rolling');sides[turn].pending=d;q=makeQ();round++;showQ()}},65)}function showQ(){let s=sides[turn],known=q.kind==='multi'?s.multi[q.idx]:s.add[q.idx],flash=round%5===0,use=flash||timeMode.value==='on'||(timeMode.value==='adaptive'&&known>=5);bonus.textContent=flash?'⚡ DESAFIO BÔNUS: +250 pontos':'';question.textContent=q.text;answer.value='';tip.textContent='';challenge.classList.remove('hidden');answer.focus();timerWrap.classList.toggle('hidden',!use);clearInterval(timerId);if(use){timeLeft=flash?10:known>=8?12:20;paint(timeLeft);timerId=setInterval(()=>{timeLeft--;paint(flash?10:known>=8?12:20);if(timeLeft<=0){clearInterval(timerId);finish(false,true,flash)}},1000)}answer.dataset.flash=flash?'1':'0'}function paint(total){clock.textContent=`⏱️ ${timeLeft}s`;bar.style.width=`${Math.max(0,timeLeft)/total*100}%`;bar.classList.toggle('danger',timeLeft<=5)}function check(){finish(+answer.value===q.ans,false,answer.dataset.flash==='1')}function finish(ok,timeout,flash){clearInterval(timerId);let s=sides[turn],move=ok?s.pending:1,old=q.kind==='multi'?s.multi[q.idx]:s.add[q.idx];if(ok){s.points+=100+(timeLeft>0?timeLeft*5:0)+(flash?250:0)+(format.value!=='individual'?50:0);if(q.kind==='multi')s.multi[q.idx]++;else s.add[q.idx]++;s.pos=Math.min(30,s.pos+move);feedback.textContent=`Muito bem! Avance ${move} casa${move>1?'s':''}.`;feedback.className='feedback good';sound('ok');confetti(old===2||old===7?45:20)}else{s.pos=Math.min(30,s.pos+1);feedback.textContent=(timeout?'Tempo esgotado. ':'')+`Resposta: ${q.ans}. Avance 1 casa pela tentativa.`;feedback.className='feedback learn';tip.textContent=q.tip;sound('bad');challenge.classList.add('shake');setTimeout(()=>challenge.classList.remove('shake'),500)}let won=s.pos>=30;saveState();turn=(turn+1)%sides.length;render();setTimeout(()=>{if(won){sound('win');confetti(80);alert(`🏆 ${s.name} chegou ao Portal Final!`)}prepare()},950)}function confetti(n){for(let i=0;i<n;i++){let c=document.createElement('i');c.className='confetti';c.textContent=['⭐','➕','✖️','🏅','✨'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2200)}}
function render(){scores.innerHTML=sides.map((s,i)=>`<div class="score ${i===turn?'active':''}"><b>${s.avatar} ${s.name}</b><span>${s.points} pts</span><small>Casa ${s.pos}/30</small></div>`).join('');board.innerHTML=Array.from({length:30},(_,v)=>{let row=Math.floor(v/5),col=v%5,num=row%2===0?v+1:(row+1)*5-col,w=Math.floor((num-1)/3),sp=num%7===0?'⚔️':num%5===0?'🎁':num%4===0?'➕':'⭐';return `<div class="cell w${w}"><small>${num}</small><span>${sp}</span>${sides.map((s,i)=>s.pos===num?`<i class="pawn p${i}">${s.avatar}</i>`:'').join('')}${sides.length===1&&sides[0].best===num?'<i class="ghost">👻</i>':''}</div>`}).join('');medals.innerHTML=sides.map(s=>`<div><b>${s.avatar} ${s.name}</b><p>${s.multi.map((x,i)=>`<span>${x>=8?'🐉 🥇':x>=3?'🛡️ 🥈':'🗺️ 🥉'} ×${i+1}</span>`).join('')}</p><p>${s.add.map((x,i)=>`<span>${x>=8?'🌟 🥇':x>=3?'🧠 🥈':'🔢 🥉'} +${[10,20,100][i]}</span>`).join('')}</p></div>`).join('');let all=Object.entries(saved().profiles||{}).filter(([k])=>k.startsWith(format.value+'|')).map(([k,v])=>({name:k.split('|')[1],...v})).sort((a,b)=>b.points-a.points).slice(0,5);leader.innerHTML=all.length?all.map((x,i)=>`<p>${['🥇','🥈','🥉','4º','5º'][i]} <b>${x.name}</b> · ${x.points} pts</p>`).join(''):'Sem resultados neste modo.'}
function newGame(){clearInterval(timerId);game.classList.add('hidden');setup.classList.remove('hidden');buildEditors()}function backup(){let b=new Blob([localStorage.getItem('trilhaMobileComplete')||'{}'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-trilha-completa.json';a.click()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{JSON.parse(r.result);localStorage.setItem('trilhaMobileComplete',r.result);alert('Backup restaurado.')}catch(e){alert('Backup inválido.')}};r.readAsText(f)}
function openTour(){tourN=0;tour.classList.add('show');drawTour()}function closeTour(){tour.classList.remove('show');localStorage.setItem('tourComplete','1')}function drawTour(){let x=T[tourN];dots.innerHTML=T.map((_,i)=>`<i class="dot ${i<=tourN?'on':''}"></i>`).join('');tourBody.innerHTML=`<div class="question">${x[0]}</div><h2>${x[1]}</h2><p>${x[2]}</p>`+(tourN===7?'<div class="practice"><button onclick="practice(7)">7</button><button onclick="practice(12)">12</button><button onclick="practice(16)">16</button></div><p id="practiceMsg"></p>':'')}function nextTour(){if(tourN<T.length-1){tourN++;drawTour()}else closeTour()}function prevTour(){if(tourN){tourN--;drawTour()}}function practice(v){practiceMsg.textContent=v===12?'✨ Correto! 4 × 3 = 12.':'Tente pensar em 3 + 3 + 3 + 3.'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.classList.remove('hidden')});install.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;install.classList.add('hidden')}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));buildEditors();if(!localStorage.getItem('tourComplete'))setTimeout(openTour,500);
</script></body></html>
