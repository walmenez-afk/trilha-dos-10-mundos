<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#291561"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Trilha dos 10 Mundos</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#9fe3ff,#eaffec);color:#17304b;min-height:100vh}main{max-width:620px;margin:auto;padding:10px}.hidden{display:none!important}h1{margin:3px 0;color:#291561;font-size:clamp(28px,6vw,54px)}button,input,select{font:inherit;padding:11px;border-radius:13px;border:2px solid #d6cef4}button{background:#ffd84a;color:#291561;font-weight:900;cursor:pointer}.card{background:#fff;border-radius:24px;padding:15px;margin:10px 0;box-shadow:0 8px 24px #0002}.setupgrid{display:grid;grid-template-columns:1fr;gap:12px}.pick{display:grid;grid-template-columns:auto 34px 1fr;align-items:center;background:#f1efff;padding:9px;border-radius:13px;margin:6px 0}.pick small{grid-column:3}.profiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.profile{background:#f1efff;border-radius:13px;padding:8px}.profile small,.profile button{display:block;margin-top:5px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:1fr;gap:12px}.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.score{background:#fff;padding:9px;border-radius:14px;border:4px solid transparent}.score.active{border-color:#ffd84a}.score span,.score small{display:block}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px;border-radius:28px;background:linear-gradient(135deg,#fff0aa,#fff,#cfe9ff)}.cell{aspect-ratio:1;position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;border:3px solid #fff;box-shadow:0 3px 8px #0002}.cell small{position:absolute;top:2px;left:5px;font-size:10px;font-weight:bold}.w0,.w1{background:#8ee7a3}.w2,.w3{background:#cbb5ff}.w4,.w5{background:#a9ddff}.w6,.w7{background:#ffd18b}.w8,.w9{background:#ffacd0}.pawn,.ghost{position:absolute;font-style:normal;font-size:24px;filter:drop-shadow(0 2px 2px #0005)}.p0{top:-16px;left:4%}.p1{top:-16px;right:4%}.p2{bottom:-15px;left:4%}.p3{bottom:-15px;right:4%}.p4{top:20%;left:32%}.ghost{opacity:.55;right:2px;bottom:0}.side{position:static;top:12px;height:fit-content}.die{font-size:70px;text-align:center;margin:8px}.primary{width:100%;padding:16px}.question{font-size:42px;font-weight:900;text-align:center;color:#291561}.answer{width:100%;font-size:30px;text-align:center}.timer{height:13px;background:#ddd;border-radius:99px;overflow:hidden}.timer i{display:block;height:100%;background:#ffd84a}.feedback{font-weight:900;text-align:center}.good{color:#16834c}.learn{color:#aa5600}.shelf span{display:inline-block;background:#f1efff;padding:5px;border-radius:9px;margin:2px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><h1>Trilha dos 10 Mundos</h1><b>Tabuada + Adição</b></div><button id="install" class="hidden">📲 Instalar</button></div><section id="setup" class="card"><h2>Prepare a partida</h2><div class="setupgrid"><div><h3>Quem vai jogar?</h3><div id="profilePick"></div><div class="profiles" id="profileCards"></div><input id="newName" placeholder="Novo apelido"><button onclick="addProfile()">Adicionar</button><button onclick="backup()">Backup</button><label>Importar <input type="file" onchange="restore(this.files[0])"></label></div><div><h3>Configurações</h3><label>Desafios <select id="challengeMode"><option value="multi">Tabuada</option><option value="add">Adição</option><option value="mixed" selected>Misto</option></select></label><br><br><label>Tempo <select id="timerMode"><option value="off">Sem tempo</option><option value="on">Com tempo</option><option value="adaptive" selected>Adaptativo</option></select></label><p>Solo: dispute contra seu próprio recorde, mostrado como um fantasma. Com 2 a 5 pessoas: cada participante tem peão, pontos e conquistas.</p><button class="primary" onclick="startGame()">COMEÇAR A AVENTURA</button></div></div></section><section id="game" class="hidden"><div id="scoreboard" class="scores"></div><div class="layout"><div class="card"><div class="top"><b id="worldText"></b><button onclick="newGame()">Nova partida</button></div><div id="board" class="board"></div><div class="card shelf"><h3>🏅 Medalhas e recompensas</h3><div id="medalShelf"></div></div></div><aside class="card side"><h2 id="turnText"></h2><div id="die" class="die">⚄</div><button id="rollBtn" class="primary" onclick="roll()">JOGAR O DADO</button><div id="challenge" class="hidden"><div id="question" class="question"></div><div id="timerWrap" class="hidden"><b id="clock"></b><div class="timer"><i id="timebar"></i></div></div><input id="answer" class="answer" inputmode="numeric" placeholder="?"><button class="primary" onclick="check()">RESPONDER</button></div><p id="tip"></p><p id="feedback" class="feedback"></p></aside></div></section></main><script>const COLS=5;const ICONS=['🧙','🦸','🧚','🥷','🧝'], WORLDS=['Jardim das Somas','Ponte do Dez','Floresta dos Dobros','Caverna do Três','Castelo do Quatro','Lago do Cinco','Montanha do Seis','Selva do Sete','Planeta do Oito','Portal Final'];
let profiles=[],players=[],turn=0,q=null,timerId,timeLeft=0,ghost=0,deferred;
const $=x=>document.getElementById(x);
function fresh(n,i=0){return{name:n,avatar:ICONS[i%5],points:0,pos:0,multi:Array(10).fill(0),add:Array(3).fill(0),best:0}}
function load(){try{profiles=JSON.parse(localStorage.getItem('trilhaBoardProfiles')||'[]')}catch(e){}if(!profiles.length)profiles=[fresh('Isadora',0)];save();setupProfiles()}
function save(){localStorage.setItem('trilhaBoardProfiles',JSON.stringify(profiles))}
function setupProfiles(){profilePick.innerHTML=profiles.map((p,i)=>`<label class="pick"><input type="checkbox" value="${i}" ${i===0?'checked':''}> <span>${p.avatar}</span> ${p.name}<small>${p.points} pts · recorde casa ${p.best}</small></label>`).join('');profileCards.innerHTML=profiles.map((p,i)=>`<div class="profile"><b>${p.avatar} ${p.name}</b><small>${p.points} pontos</small><button onclick="removeProfile(${i})">Excluir</button></div>`).join('')}
function addProfile(){let n=newName.value.trim();if(n&&profiles.length<5){profiles.push(fresh(n,profiles.length));newName.value='';save();setupProfiles()}}
function removeProfile(i){if(profiles.length>1){profiles.splice(i,1);save();setupProfiles()}}
function startGame(){let ids=[...profilePick.querySelectorAll('input:checked')].map(x=>+x.value);if(!ids.length)return alert('Escolha pelo menos um jogador.');players=ids.map(i=>({profile:i,...JSON.parse(JSON.stringify(profiles[i])),pos:0}));turn=0;ghost=players.length===1?profiles[ids[0]].best:0;setup.classList.add('hidden');game.classList.remove('hidden');render();nextTurn()}
function worldFor(pos){return Math.min(9,Math.floor(Math.max(0,pos-1)/3))}
function makeQuestion(){let p=players[turn],m=challengeMode.value==='mixed'?(Math.random()<.5?'add':'multi'):challengeMode.value;if(m==='multi'){let a=1+Math.floor(Math.random()*10),b=1+Math.floor(Math.random()*10);return{kind:m,text:`${a} × ${b} = ?`,ans:a*b,idx:a-1,tip:`Pense em ${a} grupos de ${b}.`}}let stage=p.add[0]<8?0:p.add[1]<8?1:2,max=[10,20,100][stage],a=Math.floor(Math.random()*(max+1)),b=Math.floor(Math.random()*(max-a+1));return{kind:m,text:`${a} + ${b} = ?`,ans:a+b,idx:stage,tip:'Junte as duas quantidades.'}}
function roll(){rollBtn.disabled=true;let d=1+Math.floor(Math.random()*6);die.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];players[turn].pending=d;q=makeQuestion();setTimeout(showQuestion,500)}
function showQuestion(){question.textContent=q.text;tip.textContent='';answer.value='';challenge.classList.remove('hidden');answer.focus();let p=players[turn],master=q.kind==='multi'?p.multi[q.idx]:p.add[q.idx],timed=timerMode.value==='on'||(timerMode.value==='adaptive'&&master>=5);timerWrap.classList.toggle('hidden',!timed);clearInterval(timerId);if(timed){timeLeft=master>=8?12:20;paintTime();timerId=setInterval(()=>{timeLeft--;paintTime();if(timeLeft<=0){clearInterval(timerId);finish(false,true)}},1000)}}
function paintTime(){clock.textContent=`⏱️ ${timeLeft}s`;timebar.style.width=`${timeLeft/(timeLeft>12?20:12)*100}%`}
function check(){finish(+answer.value===q.ans,false)}
function finish(ok,timeout){clearInterval(timerId);let p=players[turn],move=ok?p.pending:1;if(ok){p.points+=100+(timeLeft>0?timeLeft*5:0);if(q.kind==='multi')p.multi[q.idx]++;else p.add[q.idx]++;p.pos=Math.min(30,p.pos+move);feedback.textContent=`Muito bem! Avance ${move} casa${move>1?'s':''}.`;feedback.className='feedback good'}else{p.pos=Math.min(30,p.pos+1);feedback.textContent=(timeout?'Tempo esgotado. ':'')+`A resposta é ${q.ans}. Avance 1 casa por tentar!`;feedback.className='feedback learn';tip.textContent=q.tip}profiles[p.profile].points=Math.max(profiles[p.profile].points,p.points);profiles[p.profile].multi=p.multi;profiles[p.profile].add=p.add;profiles[p.profile].best=Math.max(profiles[p.profile].best,p.pos);save();challenge.classList.add('hidden');turn=(turn+1)%players.length;render();setTimeout(nextTurn,900)}
function nextTurn(){let p=players[turn];turnText.textContent=`Vez de ${p.name}`;worldText.textContent=WORLDS[worldFor(p.pos)];rollBtn.disabled=false;if(players.some(x=>x.pos>=30)){let win=[...players].sort((a,b)=>b.points-a.points)[0];alert(`🏆 ${win.name} venceu com ${win.points} pontos!`);setupProfiles()}}
function render(){scoreboard.innerHTML=players.map((p,i)=>`<div class="score ${i===turn?'active':''}"><b>${p.avatar} ${p.name}</b><span>${p.points} pts</span><small>Casa ${p.pos}/30</small></div>`).join('');board.innerHTML=Array.from({length:30},(_,visual)=>{let row=Math.floor(visual/COLS),col=visual%COLS,num=row%2===0?visual+1:(row+1)*COLS-col; if(num>30)return'';let w=worldFor(num),special=num%5===0?'🎁':num%7===0?'⚔️':num%4===0?'➕':'⭐';return `<div class="cell w${w}"><small>${num}</small><span>${special}</span>${players.map((p,i)=>p.pos===num?`<i class="pawn p${i}">${p.avatar}</i>`:'').join('')}${players.length===1&&ghost===num?'<i class="ghost">👻</i>':''}</div>`}).join('');medalShelf.innerHTML=players.map(p=>`<div><b>${p.avatar} ${p.name}</b><p>${p.multi.map((x,i)=>`<span title="Tabuada do ${i+1}">${x>=8?'🐉':x>=3?'🛡️':'🗺️'} ×${i+1}</span>`).join(' ')}</p><p>${p.add.map((x,i)=>`<span>${x>=8?'🌟':x>=3?'🧠':'🔢'} +${[10,20,100][i]}</span>`).join(' ')}</p></div>`).join('')}
function newGame(){clearInterval(timerId);game.classList.add('hidden');setup.classList.remove('hidden');setupProfiles()}
function backup(){let b=new Blob([JSON.stringify(profiles,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-trilha-tabuleiro.json';a.click()}
function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(Array.isArray(x)){profiles=x.slice(0,5);save();setupProfiles();alert('Backup restaurado.')}}catch(e){alert('Backup inválido.')}};r.readAsText(f)}
load();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.classList.remove('hidden')});install.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;install.classList.add('hidden')}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
